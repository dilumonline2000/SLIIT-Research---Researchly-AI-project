name: Build & Push Backend Images to ACR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1, v2)"
        required: true
        default: "v1"

env:
  REGISTRY: researchlyacrit22210524.azurecr.io

jobs:
  build-push:
    name: "Build ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api-gateway
            dockerfile: docker/Dockerfile.gateway
          - name: module1-integrity
            dockerfile: services/module1-integrity/Dockerfile
          - name: module2-collaboration
            dockerfile: services/module2-collaboration/Dockerfile
          - name: module3-data
            dockerfile: services/module3-data/Dockerfile
          - name: module4-analytics
            dockerfile: services/module4-analytics/Dockerfile
          - name: paper-chat
            dockerfile: services/paper-chat/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.event.inputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
